<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Campus Room Booking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Campus Room Booking System</h1>
    <p>Admin Panel &mdash; Approve or Reject Requests</p>
  </header>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="booking.html">Book a Room</a>
    <a href="admin.html" class="active">Admin Panel</a>
  </nav>

  <main class="container">

    <section class="admin-summary">
      <div class="summary-card">
        <h3>Pending</h3>
        <p class="count">3</p>
      </div>
      <div class="summary-card">
        <h3>Approved</h3>
        <p class="count">12</p>
      </div>
      <div class="summary-card">
        <h3>Rejected</h3>
        <p class="count">2</p>
      </div>
    </section>

    <section class="admin-table-box">
      <h2>Booking Requests</h2>
      <table>
        <thead>
          <tr>
            <th>Requester</th>
            <th>Type</th>
            <th>Room</th>
            <th>Date</th>
            <th>Time</th>
            <th>Purpose</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Campus Room Booking &mdash; Phase 1 (Basic Structure)</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
