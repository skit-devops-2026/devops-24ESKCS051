apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenith
  labels:
    app: zenith
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zenith
  template:
    metadata:
      labels:
        app: zenith
    spec:
      containers:
        - name: zenith
          image: ghcr.io/ankit-sharma-cyber/zenith:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
